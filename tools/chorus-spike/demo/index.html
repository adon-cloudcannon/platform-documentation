<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chorus spike — semantic search demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 960px;
      margin: 2em auto;
      padding: 0 1em 4em;
      line-height: 1.45;
      color: #222;
    }
    h1 { font-size: 1.6em; margin: 0 0 0.2em; }
    .subtitle { color: #666; font-size: 0.9em; margin-bottom: 0.5em; }
    .encoder-badge {
      display: inline-block;
      font-family: ui-monospace, monospace;
      font-size: 0.75em;
      background: #eef;
      color: #334;
      padding: 0.15em 0.5em;
      border-radius: 4px;
      margin-bottom: 1.5em;
    }
    .encoder-badge.loading { background: #fff3cd; color: #664; }
    .encoder-badge.ready { background: #d4edda; color: #274; }
    .encoder-badge.error { background: #f8d7da; color: #712; }
    input[type="search"] {
      width: 100%;
      padding: 0.75em 1em;
      font-size: 1.1em;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: inherit;
    }
    input[type="search"]:focus { outline: 2px solid #1976d2; outline-offset: -1px; }
    .test-queries {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4em;
      margin: 1em 0 0.4em;
    }
    .test-queries button {
      padding: 0.35em 0.75em;
      font-size: 0.85em;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
    }
    .test-queries button:hover { background: #eee; }
    .test-queries button.active { background: #e3f2fd; border-color: #64b5f6; }
    .meta { color: #666; font-size: 0.85em; margin: 1em 0; }
    .warming {
      padding: 0.6em 1em;
      background: #fff3cd;
      border-radius: 6px;
      color: #664;
      font-size: 0.9em;
      margin: 1em 0;
    }
    .results { margin-top: 0.5em; }
    .result { padding: 0.9em 0; border-bottom: 1px solid #eee; }
    .result .heading-path { color: #666; font-size: 0.82em; margin-bottom: 0.2em; }
    .result .heading-path .sep { opacity: 0.5; margin: 0 0.3em; }
    .result h3 { margin: 0 0 0.2em; font-size: 1em; }
    .result h3 a { color: #1565c0; text-decoration: none; }
    .result h3 a:hover { text-decoration: underline; }
    .result .excerpt { color: #444; font-size: 0.9em; }
    .result .score {
      float: right;
      color: #999;
      font-family: ui-monospace, monospace;
      font-size: 0.8em;
    }
    .compare-link { font-size: 0.85em; color: #666; margin-left: 0.5em; }
  </style>
</head>
<body>
  <h1>chorus spike</h1>
  <p class="subtitle">
    Semantic search prototype for CloudCannon docs. ONNX teacher, lazy-loaded.
    Links open on production for side-by-side comparison with Pagefind.
  </p>
  <div class="encoder-badge" id="encoder-badge">encoder: not loaded</div>

  <input id="q" type="search"
         placeholder="Try: 'locking editing', 'block editors from deleting', 'widgets'"
         autocomplete="off" spellcheck="false" />

  <div class="test-queries" id="test-queries"></div>

  <div class="meta" id="meta"></div>

  <div class="results" id="results"></div>

  <script type="module">
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2";

    const MODEL = "Xenova/multi-qa-MiniLM-L6-cos-v1";
    const DIM = 384;
    const BASE = "https://cloudcannon.com";

    const TEST_QUERIES = [
      "locking editing",
      "block editors from deleting",
      "how do I add a dropdown",
      "let translators edit only certain files",
      "custom styles in the editor",
      "why won't my build finish",
      "how do I connect my repo",
      "what's the difference between a schema and a structure",
      "widgets",
      "forms",
      "fields",
      "how do I let editors change page titles",
      "can I have two people editing at once",
      "syncing to prod",
      "images not loading",
      "make images look sharp",
      "postbuild",
      "cloudcannon.config.yml",
      "publish workflow",
      "translate my site",
    ];

    const $ = (id) => document.getElementById(id);
    const badge = $("encoder-badge");
    const input = $("q");
    const resultsEl = $("results");
    const metaEl = $("meta");
    const testEl = $("test-queries");

    for (const q of TEST_QUERIES) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = q;
      b.onclick = () => {
        for (const bb of testEl.querySelectorAll("button")) bb.classList.remove("active");
        b.classList.add("active");
        input.value = q;
        runSearch(q);
      };
      testEl.appendChild(b);
    }

    function setBadge(text, cls = "") {
      badge.textContent = text;
      badge.className = "encoder-badge" + (cls ? " " + cls : "");
    }

    // Load index eagerly — small, needed for any search.
    let index, bytes;
    try {
      const t0 = performance.now();
      const indexResp = await fetch("./semantic-index.json");
      if (!indexResp.ok) throw new Error(`index fetch: ${indexResp.status}`);
      index = await indexResp.json();
      const raw = Uint8Array.from(atob(index.embeddings), (c) => c.charCodeAt(0));
      bytes = new Int8Array(raw.buffer);
      const dt = (performance.now() - t0).toFixed(0);
      setBadge(`encoder: not loaded  ·  index: ${index.chunks.length} chunks in ${dt}ms`);
    } catch (err) {
      setBadge(`index load failed: ${err.message}`, "error");
      throw err;
    }

    // Lazy load the model.
    let extractor = null;
    let modelPromise = null;
    let pendingQuery = null;

    function loadModel() {
      if (modelPromise) return modelPromise;
      setBadge(`encoder: ${MODEL} — warming up (22 MB, one-time)…`, "loading");
      const t0 = performance.now();
      modelPromise = pipeline("feature-extraction", MODEL, { dtype: "q8" })
        .then((m) => {
          extractor = m;
          const dt = ((performance.now() - t0) / 1000).toFixed(1);
          setBadge(
            `encoder: ${MODEL}  ·  ready in ${dt}s  ·  ${index.chunks.length} chunks × ${DIM}d`,
            "ready",
          );
          if (pendingQuery) {
            const q = pendingQuery;
            pendingQuery = null;
            runSearch(q);
          }
          return m;
        })
        .catch((err) => {
          setBadge(`model load failed: ${err.message}`, "error");
          throw err;
        });
      return modelPromise;
    }

    // Kick off in idle time as an aggressive preload…
    const idle = window.requestIdleCallback ?? ((cb) => setTimeout(cb, 800));
    idle(() => loadModel(), { timeout: 2000 });
    // …and also on focus so intent triggers it immediately if idle didn't already.
    input.addEventListener("focus", loadModel, { once: false });

    async function runSearch(q) {
      const query = q.trim();
      if (!query) { resultsEl.innerHTML = ""; metaEl.textContent = ""; return; }

      if (!extractor) {
        pendingQuery = query;
        resultsEl.innerHTML =
          `<div class="warming">Warming up the encoder… your query will run as soon as it's ready.</div>`;
        loadModel();
        return;
      }

      const t0 = performance.now();
      const out = await extractor(query, { pooling: "mean", normalize: true });
      const qv = out.data;

      const scores = new Float32Array(index.chunks.length);
      for (let i = 0; i < index.chunks.length; i++) {
        let s = 0;
        const base = i * DIM;
        for (let k = 0; k < DIM; k++) s += qv[k] * bytes[base + k];
        scores[i] = s / 127;
      }

      const top = Array.from(scores.keys())
        .sort((a, b) => scores[b] - scores[a])
        .slice(0, 10);

      const dt = (performance.now() - t0).toFixed(1);
      const pagefindUrl = `${BASE}/documentation/?q=${encodeURIComponent(query)}`;
      metaEl.innerHTML =
        `${index.chunks.length} chunks searched in ${dt}ms` +
        ` <a class="compare-link" href="${pagefindUrl}" target="_blank">Compare on Pagefind →</a>`;

      resultsEl.innerHTML = top.map((i) => {
        const c = index.chunks[i];
        const anchor = c.anchor ? `#${c.anchor}` : "";
        const title = c.headingPath[c.headingPath.length - 1] || c.url;
        const path = c.headingPath.map(escape).join('<span class="sep">›</span>');
        return `
          <div class="result">
            <span class="score">${scores[i].toFixed(3)}</span>
            <div class="heading-path">${path}</div>
            <h3><a href="${BASE}${c.url}${anchor}" target="_blank">${escape(title)}</a></h3>
            <div class="excerpt">${escape(c.excerpt)}…</div>
          </div>
        `;
      }).join("");
    }

    function escape(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    let timer;
    input.addEventListener("input", (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => runSearch(e.target.value), 200);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { clearTimeout(timer); runSearch(input.value); }
    });
  </script>
</body>
</html>
